# Production front for Fixloop: serves web/dist and proxies /api to the API on the same origin,
# so the SameSite=Lax session cookie and the API's `Origin === APP_URL` CSRF check both hold.
#
# Before use, replace:
#   /srv/fixloop/web/dist     the built SPA (`cd web && npm run build`)
#   127.0.0.1:4000            the API (`cd server && npm run build && npm start`)
#   https://uploads.example   the S3/R2 bucket origin presigned URLs point at (uploads + photos)
# Terminate TLS here (add `listen 443 ssl` + certificates) or at a load balancer in front.
# The API must then run with TRUST_PROXY=1 (or 2 behind LB + nginx) and APP_URL=https://<this host>.
# Test locally: nginx -p /tmp/fixloop-nginx -c "$PWD/deploy/nginx.conf"

worker_processes auto;
pid /tmp/fixloop-nginx.pid;
events {}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m; # matches the API's JSON body cap; files go straight to S3
  access_log off;          # the API logs requests itself
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;
  # The API doesn't compress; without this, proxied JSON goes out raw (dashboard at 300 doors: 50 KB → 8 KB).
  gzip_proxied any;
  gzip_vary on;

  server {
    listen 8080;
    root /srv/fixloop/web/dist;

    # One CSP for the whole SPA. 'unsafe-inline' styles: React style props and the QR print window.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://uploads.example; connect-src 'self' https://uploads.example; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location /api/ {
      proxy_pass http://127.0.0.1:4000/;  # trailing slash strips the /api prefix
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location ~ \.map$ { return 404; }

    # Every other path is a client-side route (incl. /l/<token> link pages and the /ops console): serve the shell, never cache it.
    location / {
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header X-Frame-Options DENY always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
